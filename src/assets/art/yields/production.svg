<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Production">
  <title>Production — smith's hammer mid-swing</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- swing motion arcs -->
  <path d="M14.5 24 Q12.5 34 16.5 42" fill="none" stroke="#B3A685" stroke-width="1.2" opacity=".5"/>
  <path d="M18.5 21.5 Q15.8 33 20 43" fill="none" stroke="#B3A685" stroke-width="1" opacity=".35"/>

  <g transform="rotate(-38 32 36)">
    <!-- wooden handle -->
    <rect x="29.4" y="27" width="5.2" height="26" rx="2.2"
          fill="#8A6B45" stroke="#12100D" stroke-width="1.5"/>
    <path d="M32 31 V49" stroke="#12100D" stroke-width="1" opacity=".3"/>

    <!-- gold wedge binding head to handle -->
    <path d="M27.6 29.5 H36.4 L32 23.5 Z" fill="#C8A24A" stroke="#12100D" stroke-width="1"/>

    <!-- rust-iron head with striking face -->
    <rect x="17" y="15.5" width="30" height="13" rx="2.6"
          fill="#C96F3B" stroke="#12100D" stroke-width="1.7"/>
    <rect x="17" y="15.5" width="4.6" height="13" rx="2"
          fill="#E08A52" stroke="#12100D" stroke-width=".9"/>
    <path d="M25 19 H39 M25 22.5 H39" stroke="#12100D" stroke-width=".9" opacity=".35"/>
  </g>

  <!-- strike sparks -->
  <g stroke="#F1D79A" stroke-width="1.5" stroke-linecap="round">
    <path d="M14.8 12.5 L17.4 15.4"/>
    <path d="M11.8 18.4 L15.4 19.6"/>
    <path d="M20.6 9.6 L21.6 13.2"/>
  </g>
</svg>
