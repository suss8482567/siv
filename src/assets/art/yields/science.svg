<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Science">
  <title>Science</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="54" rx="12" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- liquid body -->
  <path d="M24.4 30 L39.6 30 L47.4 44.2 Q49.4 49.8 42.8 49.8 H21.2 Q14.6 49.8 16.6 44.2 Z"
        fill="#5AA9D6" opacity=".88"/>
  <!-- surface meniscus + rising bubbles -->
  <ellipse cx="32" cy="30" rx="7.6" ry="1.9" fill="#8CC3E8"/>
  <circle cx="29.8" cy="41.5" r="1.7" fill="#C9E4F5" opacity=".9"/>
  <circle cx="35" cy="37.5" r="1.2" fill="#C9E4F5" opacity=".9"/>
  <circle cx="31.8" cy="46.2" r="1" fill="#C9E4F5" opacity=".9"/>

  <!-- glass outline -->
  <path d="M27 12.5 V25 L16.6 44.2 Q14.6 49.8 21.2 49.8 H42.8 Q49.4 49.8 47.4 44.2 L37 25 V12.5"
        fill="none" stroke="#E8DCC0" stroke-width="2" stroke-linejoin="round"/>
  <!-- rolled rim (gold lip) -->
  <rect x="24.8" y="10" width="14.4" height="3.4" rx="1.7"
        fill="#1D1A14" stroke="#C8A24A" stroke-width="1.5"/>

  <!-- etched graduation ticks -->
  <path d="M20.4 38.5 H23 M18 43 H20.6" stroke="#B3A685" stroke-width="1" opacity=".6"/>
</svg>
