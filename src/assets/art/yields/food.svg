<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Food">
  <title>Food — bound wheat sheaf</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="56" rx="11" ry="2" fill="#12100D" opacity=".45"/>

  <defs>
    <!-- one stalk with paired grains and a bearded tip -->
    <g id="stalk">
      <path d="M32 48 V17" stroke="#5E7F46" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 12.5 V7.5" stroke="#5E7F46" stroke-width="1" opacity=".8"/>
      <g fill="#E8DCC0" stroke="#5E7F46" stroke-width="1">
        <ellipse cx="28.6" cy="21" rx="2.6" ry="5.4" transform="rotate(-30 28.6 21)"/>
        <ellipse cx="35.4" cy="21" rx="2.6" ry="5.4" transform="rotate(30 35.4 21)"/>
        <ellipse cx="28.6" cy="27" rx="2.6" ry="5.4" transform="rotate(-30 28.6 27)"/>
        <ellipse cx="35.4" cy="27" rx="2.6" ry="5.4" transform="rotate(30 35.4 27)"/>
        <ellipse cx="28.6" cy="33" rx="2.6" ry="5.4" transform="rotate(-30 28.6 33)"/>
        <ellipse cx="35.4" cy="33" rx="2.6" ry="5.4" transform="rotate(30 35.4 33)"/>
      </g>
    </g>
  </defs>

  <use href="#stalk"/>
  <use href="#stalk" transform="rotate(-20 32 48)"/>
  <use href="#stalk" transform="rotate(20 32 48)"/>

  <!-- gold binding cord -->
  <rect x="28.4" y="43.4" width="7.2" height="3.8" rx="1.6"
        fill="#C8A24A" stroke="#12100D" stroke-width="1"/>
  <path d="M30.4 47.2 L29.8 51.6 M33.6 47.2 L34.2 51.6" stroke="#5E7F46" stroke-width="1.3" stroke-linecap="round"/>
</svg>
