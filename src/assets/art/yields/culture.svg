<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Culture">
  <title>Culture</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="54" rx="11" ry="2" fill="#12100D" opacity=".45"/>

  <!-- arms -->
  <path d="M27 41 C19.5 39 17.5 30.5 20 22.5" fill="none" stroke="#B07FC7" stroke-width="3" stroke-linecap="round"/>
  <path d="M37 41 C44.5 39 46.5 30.5 44 22.5" fill="none" stroke="#B07FC7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="21.6" r="1.8" fill="#B07FC7" stroke="#12100D" stroke-width=".9"/>
  <circle cx="44" cy="21.6" r="1.8" fill="#B07FC7" stroke="#12100D" stroke-width=".9"/>

  <!-- soundbox -->
  <path d="M26.5 38 H37.5 L36 45.5 Q35.5 50.5 32 50.5 Q28.5 50.5 28 45.5 Z"
        fill="#B07FC7" stroke="#12100D" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M29 41.5 H35" stroke="#12100D" stroke-width="1" opacity=".4"/>

  <!-- strings (gold) -->
  <g stroke="#C8A24A" stroke-width="1.1">
    <path d="M27.6 21 V38"/>
    <path d="M30.5 21 V38"/>
    <path d="M33.5 21 V38"/>
    <path d="M36.4 21 V38"/>
  </g>

  <!-- crossbar with gold end knobs -->
  <path d="M16.5 19.5 H47.5" stroke="#C8A24A" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="16.5" cy="19.5" r="1.9" fill="#C8A24A" stroke="#12100D" stroke-width=".9"/>
  <circle cx="47.5" cy="19.5" r="1.9" fill="#C8A24A" stroke="#12100D" stroke-width=".9"/>
</svg>
