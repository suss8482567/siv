  <path d="M24.5 21 Q32 19 39.5 21 L41 26.5 Q40 29 40.8 32 Q39.7 36 40.4 39 Q39 42.5 34.5 41.8 L32 43 L29.5 41.8 Q25 42.5 23.6 39 Q24.3 36 23.2 32 Q24 29 23 26.5 Z"
        fill="#A98F63" opacity=".9"/>
