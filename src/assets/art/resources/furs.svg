  <path d="M21 17 Q32 14.5 43 17 L45.5 25 Q44 28 45 31.5 Q43.5 37 44.5 41 Q42.5 46.5 36 45.5 L32 47 L28 45.5 Q21.5 46.5 19.5 41 Q20.5 37 19 31.5 Q20 28 18.5 25 Z"
