  <g stroke="#4A3A22" stroke-width="1" opacity=".6">
    <path d="M26 24 L25 27"/>
    <path d="M33 23 L32.4 26"/>
    <path d="M38.5 25 L37.8 28"/>
    <path d="M27.5 34 L26.7 37"/>
    <path d="M36 34.5 L35.4 37.5"/>
