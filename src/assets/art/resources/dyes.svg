<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dyes">
  <title>Dyes — indigo vat with dipped cloth</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="31" cy="50" rx="13" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- hanging cloth, dyed at the bottom -->
  <path d="M40.5 31.5 L45.8 33 L44.8 45 L39.6 43.4 Z" fill="#E8DCC0" stroke="#12100D" stroke-width="1.4"/>
  <path d="M40.2 38.4 L44.4 39.7 L44.1 44.2 L39.9 42.8 Z" fill="#3E4E8C" opacity=".85"/>
  <path d="M42.9 46.6 q-.5 1.4 .3 2.2" fill="none" stroke="#3E4E8C" stroke-width="1.3" stroke-linecap="round"/>

  <!-- pot body -->
  <path d="M21 34 Q21 46 27 46.5 H37 Q43 46 43 34 Z"
        fill="#8A5638" stroke="#12100D" stroke-width="1.8"/>

  <!-- indigo surface -->
  <ellipse cx="32" cy="33.5" rx="11" ry="3.2" fill="#3E4E8C" stroke="#12100D" stroke-width="1.5"/>
  <path d="M26 33 Q31 31.5 36 33" fill="none" stroke="#6B7FC4" stroke-width="1" opacity=".9"/>

  <!-- gold handle ring -->
  <circle cx="23.5" cy="37" r="1.7" fill="none" stroke="#C8A24A" stroke-width="1.3"/>
</svg>
