<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Salt">
  <title>Salt — crystal harvest</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="49.5" rx="14" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- back crystal -->
  <polygon points="36,30 41,27.5 46,30 41,32.5" fill="#F2ECDC" stroke="#12100D" stroke-width="1.2"/>
  <polygon points="36,30 41,32.5 41,39 36,36.5" fill="#CFC3A4" stroke="#12100D" stroke-width="1.2"/>
  <polygon points="41,32.5 46,30 46,36.5 41,39" fill="#DED2B4" stroke="#12100D" stroke-width="1.2"/>

  <!-- main crystal -->
  <polygon points="26,34 32,31 38,34 32,37" fill="#F2ECDC" stroke="#12100D" stroke-width="1.3"/>
  <polygon points="26,34 32,37 32,45 26,42" fill="#CFC3A4" stroke="#12100D" stroke-width="1.3"/>
  <polygon points="32,37 38,34 38,42 32,45" fill="#DED2B4" stroke="#12100D" stroke-width="1.3"/>

  <!-- front-left crystal -->
  <polygon points="19,40 23,38 27,40 23,42" fill="#F2ECDC" stroke="#12100D" stroke-width="1.1"/>
  <polygon points="19,40 23,42 23,47 19,45" fill="#CFC3A4" stroke="#12100D" stroke-width="1.1"/>
  <polygon points="23,42 27,40 27,45 23,47" fill="#DED2B4" stroke="#12100D" stroke-width="1.1"/>

  <!-- scattered grains -->
  <g fill="#EDE7DA">
    <circle cx="29" cy="47.2" r=".8"/>
    <circle cx="33" cy="48" r=".7"/>
    <circle cx="25" cy="48.4" r=".6"/>
  </g>

  <!-- gold scoop -->
  <path d="M40 47.5 L49 43.5" stroke="#C8A24A" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="39" cy="48" rx="2.2" ry="1.4" fill="#C8A24A" stroke="#12100D" stroke-width=".8"/>
</svg>
