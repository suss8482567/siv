<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Horses">
  <title>Horses</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="31" cy="52" rx="11" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- ears -->
  <path d="M25.5 13.5 L27.5 10 L28.8 13.6 Z" fill="#8A6B45" stroke="#12100D" stroke-width="1.2"/>
  <path d="M29.5 13.2 L31.5 10.2 L32.2 14 Z" fill="#8A6B45" stroke="#12100D" stroke-width="1.2"/>

  <!-- head + neck -->
  <path d="M25.5 13.5 Q20.5 14.5 19.5 19 Q19 21.5 21 23 L24.5 25.5 Q21.5 31.5 23 37 Q24.3 42 28 45.5 H39.5 Q38.5 41 39.5 36.5 Q40.8 30.5 37.5 26.5 Q34 22.5 28.5 21.5 L26 21 Q24 20.5 24.3 18 Q24.6 15 25.5 13.5 Z"
        fill="#8A6B45" stroke="#12100D" stroke-width="1.8"/>

  <!-- mane -->
  <path d="M37 26 Q39.5 31 38 37 Q37.2 41 38.3 45" fill="none" stroke="#4A3A22" stroke-width="3" stroke-linecap="round"/>
  <path d="M27 12.5 Q29 10.5 31.5 11.5" fill="none" stroke="#4A3A22" stroke-width="2" stroke-linecap="round"/>

  <!-- blaze -->
  <path d="M23.5 15.5 Q22.8 19 24.8 21.8" fill="none" stroke="#E8DCC0" stroke-width="1.6" opacity=".95"/>
  <circle cx="23.8" cy="18.5" r="1.1" fill="#12100D"/>
  <circle cx="21" cy="22.3" r=".8" fill="#12100D"/>

  <!-- gold bridle -->
  <path d="M20.8 20.2 Q23.5 22.3 26 21.5" fill="none" stroke="#C8A24A" stroke-width="1.5"/>
  <path d="M22.5 20.8 L26.5 24.5" fill="none" stroke="#C8A24A" stroke-width="1.5"/>
</svg>
