<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wine">
  <title>Wine — bronze goblet</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="51" rx="11" ry="2" fill="#12100D" opacity=".45"/>

  <!-- bowl -->
  <path d="M20 18 H44 Q43 27 37 30.5 H27 Q21 27 20 18 Z"
        fill="#B0763A" stroke="#12100D" stroke-width="1.7"/>
  <path d="M25.5 21 Q26 25.5 28.5 28" fill="none" stroke="#7D5426" stroke-width=".9" opacity=".7"/>
  <path d="M38.5 21 Q38 25.5 35.5 28" fill="none" stroke="#7D5426" stroke-width=".9" opacity=".7"/>

  <!-- stem + foot -->
  <rect x="30.2" y="30.5" width="3.6" height="11" fill="#B0763A" stroke="#12100D" stroke-width="1.4"/>
  <ellipse cx="32" cy="44.5" rx="8.5" ry="2.6" fill="#B0763A" stroke="#12100D" stroke-width="1.5"/>

  <!-- wine surface with gold lip -->
  <ellipse cx="32" cy="18" rx="12" ry="3.2" fill="#8E3038" stroke="#C8A24A" stroke-width="1.6"/>
  <path d="M26 17.4 Q32 15.9 38 17.4" fill="none" stroke="#C05860" stroke-width="1" opacity=".85"/>
</svg>
