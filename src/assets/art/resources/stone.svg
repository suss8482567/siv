<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stone">
  <title>Stone — quarried ashlar blocks</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="50.5" rx="15" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- back block -->
  <rect x="17" y="24" width="30" height="11" rx="1" fill="#7D7568" stroke="#12100D" stroke-width="1.6"/>
  <path d="M18.5 26.8 H45.5" stroke="#B3A685" stroke-width="1" opacity=".8"/>

  <!-- front block -->
  <rect x="21" y="35" width="26" height="12" rx="1" fill="#8D8578" stroke="#12100D" stroke-width="1.6"/>
  <circle cx="25.5" cy="39.5" r=".8" fill="#4A4438" opacity=".7"/>
  <circle cx="43" cy="43.5" r=".8" fill="#4A4438" opacity=".7"/>
  <path d="M23 44.5 H34" stroke="#B3A685" stroke-width="1" opacity=".6"/>

  <!-- gold mason's mark -->
  <polygon points="36,38.5 38.5,41 36,43.5 33.5,41" fill="none" stroke="#C8A24A" stroke-width="1.3"/>
</svg>
