<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fish">
  <title>Fish — river catch</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- water ripples -->
  <ellipse cx="25" cy="48" rx="7" ry="1.4" fill="#12100D" opacity=".35"/>
  <ellipse cx="38" cy="50.5" rx="9" ry="1.5" fill="#12100D" opacity=".35"/>

  <!-- tail -->
  <path d="M17 32.5 L10.5 25.5 Q13 32.5 10.5 39.5 L17 35 Z" fill="#7FA3A8" stroke="#12100D" stroke-width="1.5"/>
  <!-- body, head to the right -->
  <path d="M16.5 33.75 Q22 25.5 33 25 Q43.5 24.5 47.5 31 Q43 37 33 37.5 Q21.5 38 16.5 33.75 Z"
        fill="#7FA3A8" stroke="#12100D" stroke-width="1.8"/>
  <!-- dorsal fin -->
  <path d="M27 25.6 Q29.5 21.5 33.5 21.2 Q31 24.8 30.5 25.4 Z" fill="#5B7F84" stroke="#12100D" stroke-width="1"/>
  <!-- belly sheen -->
  <path d="M20 35 Q30 36.5 42 33.5" fill="none" stroke="#E8DCC0" stroke-width="1.4" opacity=".9"/>
  <!-- eye -->
  <circle cx="43.5" cy="28.8" r="1.1" fill="#12100D"/>

  <!-- gold gill plate -->
  <path d="M39.5 26.3 Q42 30.5 39.5 35" fill="none" stroke="#C8A24A" stroke-width="1.5"/>
</svg>
