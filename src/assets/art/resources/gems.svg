<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gems">
  <title>Gems</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="49.5" rx="12" ry="2" fill="#12100D" opacity=".45"/>

  <!-- pavilion + crown silhouette -->
  <polygon points="25,22 39,22 47,31 32,46 17,31" fill="#58A87A" stroke="#12100D" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- facets -->
  <g stroke="#12100D" stroke-width="1">
    <polygon points="25,22 39,22 35.5,27 28.5,27" fill="#9FD4BC"/>
    <polygon points="25,22 28.5,27 17,31" fill="#6FBF94"/>
    <polygon points="39,22 47,31 35.5,27" fill="#4E9068"/>
    <polygon points="17,31 28.5,27 32,46" fill="#58A87A"/>
    <polygon points="28.5,27 35.5,27 32,46" fill="#9FD4BC" opacity=".9"/>
    <polygon points="35.5,27 47,31 32,46" fill="#4E9068"/>
  </g>

  <!-- gold spark -->
  <path d="M44.5 15.5 v4 M42.5 17.5 h4" stroke="#E0B45C" stroke-width="1.1" stroke-linecap="round"/>
</svg>
