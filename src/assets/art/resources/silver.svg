<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Silver">
  <title>Silver</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="50.5" rx="14" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- bottom coin -->
  <path d="M19 43 Q32 47.6 45 43 V40 Q32 44.6 19 40 Z" fill="#8A8FA8" stroke="#12100D" stroke-width="1.2"/>
  <ellipse cx="32" cy="40" rx="13" ry="4" fill="#CDD2DA" stroke="#12100D" stroke-width="1.3"/>

  <!-- middle coin -->
  <path d="M19 39 Q32 43.6 45 39 V36 Q32 40.6 19 36 Z" fill="#8A8FA8" stroke="#12100D" stroke-width="1.2"/>
  <ellipse cx="32" cy="36" rx="13" ry="4" fill="#CDD2DA" stroke="#12100D" stroke-width="1.3"/>

  <!-- top coin -->
  <path d="M19 35 Q32 39.6 45 35 V32 Q32 36.6 19 32 Z" fill="#8A8FA8" stroke="#12100D" stroke-width="1.2"/>
  <ellipse cx="32" cy="32" rx="13" ry="4" fill="#CDD2DA" stroke="#12100D" stroke-width="1.3"/>
  <!-- struck face -->
  <ellipse cx="32" cy="31.6" rx="7.5" ry="2.2" fill="none" stroke="#9AA0AD" stroke-width=".9"/>
  <circle cx="32" cy="31.6" r=".9" fill="#9AA0AD"/>

  <!-- gold binding cord -->
  <path d="M18.6 37 Q32 41.4 45.4 37" fill="none" stroke="#C8A24A" stroke-width="1.5"/>
  <circle cx="45.4" cy="37" r="1.5" fill="none" stroke="#C8A24A" stroke-width="1.2"/>
</svg>
