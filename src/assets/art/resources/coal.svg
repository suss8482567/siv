<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Coal">
  <title>Coal</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="50.5" rx="15" ry="2.4" fill="#12100D" opacity=".45"/>

  <!-- big lump -->
  <polygon points="20,44 17,36 23,29 32,30 34,38 28,45" fill="#26221C" stroke="#4A4438" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M23 29 L27 36 L34 38 M27 36 L28 45" fill="none" stroke="#4A4438" stroke-width=".9"/>

  <!-- right lump -->
  <polygon points="36,42 34,34 41,30 47,35 46,42 41,45" fill="#2B2620" stroke="#4A4438" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M41 30 L41.5 37 M34 34 L41.5 37 L46 42" fill="none" stroke="#4A4438" stroke-width=".9"/>

  <!-- front lump -->
  <polygon points="26,46 28,41 35,41.5 36,46 31,48" fill="#211D18" stroke="#4A4438" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- glints -->
  <path d="M22 33 L24 31.5" stroke="#B3A685" stroke-width="1" opacity=".85"/>
  <path d="M38.5 33 L40 31.8" stroke="#B3A685" stroke-width="1" opacity=".85"/>

  <!-- gold vein -->
  <path d="M24 42 Q26 38 25.5 34" fill="none" stroke="#C8A24A" stroke-width="1.1" opacity=".95"/>
</svg>
