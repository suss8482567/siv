<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Silk">
  <title>Silk</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="49.5" rx="15" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- draping sheet -->
  <path d="M17 34.5 Q16 43.5 24 46 L44 46 Q48.5 43.5 47 34.5 Z"
        fill="#EFE6CE" stroke="#12100D" stroke-width="1.6"/>
  <path d="M24 35.5 Q24 42 26 45.5" fill="none" stroke="#B3A685" stroke-width="1"/>
  <path d="M36 35.5 Q36.5 42 35.5 45.5" fill="none" stroke="#B3A685" stroke-width="1"/>

  <!-- roll -->
  <rect x="15" y="26" width="30" height="9" rx="4.5" fill="#E8DCC0" stroke="#12100D" stroke-width="1.7"/>
  <ellipse cx="45.5" cy="30.5" rx="3" ry="4.5" fill="#D9CBA8" stroke="#12100D" stroke-width="1.2"/>
  <path d="M45.8 27.8 q1.8 2.7 -.4 5" fill="none" stroke="#B3A685" stroke-width=".9"/>
  <path d="M20 28.7 H39" stroke="#F5EFDF" stroke-width="1" opacity=".95"/>

  <!-- gold needle pin -->
  <path d="M21.5 30.8 L41.5 28" stroke="#C8A24A" stroke-width="1.4"/>
  <circle cx="21.5" cy="30.8" r="1.2" fill="#E0B45C" stroke="#12100D" stroke-width=".7"/>
</svg>
