<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Spices">
  <title>Spices — mortar and pestle</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="51.5" rx="13" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- pestle (behind rim) -->
  <path d="M43.5 15 Q46.5 14 47.2 16.4 Q47.7 18.3 45.5 19.3 L38 33.5" fill="none" stroke="#6E5433" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="45.8" cy="16.4" r="2.8" fill="#6E5433" stroke="#12100D" stroke-width="1.3"/>

  <!-- spice mound -->
  <path d="M22.5 32.5 Q26 24.5 32 24 Q38 24.5 41.5 32.5 Z" fill="#C96F3B" stroke="#12100D" stroke-width="1.4"/>
  <circle cx="28.5" cy="29" r=".7" fill="#E08A52"/>
  <circle cx="33" cy="27" r=".7" fill="#E08A52"/>
  <circle cx="36.5" cy="30" r=".7" fill="#E08A52"/>

  <!-- mortar bowl -->
  <path d="M19 33 Q19.5 45 27 47 H37 Q44.5 45 45 33 Z" fill="#6E5433" stroke="#12100D" stroke-width="1.8"/>
  <rect x="26.5" y="47" width="11" height="2.6" rx=".8" fill="#4A3A22" stroke="#12100D" stroke-width="1"/>
  <!-- bowl front lip over the mound -->
  <path d="M19.2 32.6 Q32 37.8 44.8 32.6" fill="none" stroke="#12100D" stroke-width="1.6"/>

  <!-- gold lip band -->
  <path d="M20.4 35.6 Q32 39.6 43.6 35.6" fill="none" stroke="#C8A24A" stroke-width="1.4"/>
</svg>
