<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wheat">
  <title>Wheat</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="53.5" rx="10" ry="2" fill="#12100D" opacity=".45"/>

  <!-- stem + awn -->
  <path d="M32 48 V15" fill="none" stroke="#5E7F46" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M32 13 V9" fill="none" stroke="#5E7F46" stroke-width="1" opacity=".85"/>

  <!-- grain pairs -->
  <g fill="#E8DCC0" stroke="#5E7F46" stroke-width="1">
    <ellipse cx="28.3" cy="19" rx="2.9" ry="6" transform="rotate(-30 28.3 19)"/>
    <ellipse cx="35.7" cy="19" rx="2.9" ry="6" transform="rotate(30 35.7 19)"/>
    <ellipse cx="28.3" cy="26" rx="2.9" ry="6" transform="rotate(-30 28.3 26)"/>
    <ellipse cx="35.7" cy="26" rx="2.9" ry="6" transform="rotate(30 35.7 26)"/>
    <ellipse cx="28.3" cy="33" rx="2.9" ry="6" transform="rotate(-30 28.3 33)"/>
    <ellipse cx="35.7" cy="33" rx="2.9" ry="6" transform="rotate(30 35.7 33)"/>
    <ellipse cx="28.3" cy="40" rx="2.9" ry="6" transform="rotate(-30 28.3 40)"/>
    <ellipse cx="35.7" cy="40" rx="2.9" ry="6" transform="rotate(30 35.7 40)"/>
  </g>

  <!-- gold tie band -->
  <rect x="29" y="46.6" width="6" height="3.4" rx="1.5"
        fill="#C8A24A" stroke="#12100D" stroke-width=".9"/>
</svg>
