<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Iron">
  <title>Iron</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="48.5" rx="16" ry="2.4" fill="#12100D" opacity=".45"/>

  <!-- crossed ingot bars -->
  <g stroke="#12100D">
    <rect x="13.5" y="28.5" width="26" height="9.5" rx="1.8"
          fill="#7E8698" stroke-width="1.6" transform="rotate(-14 26.5 33.2)"/>
    <rect x="24.5" y="28.5" width="26" height="9.5" rx="1.8"
          fill="#8F97A6" stroke-width="1.6" transform="rotate(12 37.5 33.2)"/>
  </g>
  <!-- top sheen on each bar -->
  <path d="M15.5 30 L37.5 24.5" stroke="#AEB6C4" stroke-width="1" opacity=".9"/>
  <path d="M27 29.5 L48.5 35.5" stroke="#C2C8D4" stroke-width="1" opacity=".9"/>

  <!-- gold assay stamp -->
  <circle cx="27.5" cy="34.5" r="2.1" fill="none" stroke="#C8A24A" stroke-width="1.2"/>
  <circle cx="27.5" cy="34.5" r=".7" fill="#C8A24A"/>
</svg>
