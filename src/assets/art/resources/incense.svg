<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Incense">
  <title>Incense — burning sticks in a bronze dish</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="51" rx="13" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- smoke -->
  <path d="M26 17.8 Q24.4 15.4 26.4 13.4 Q28 12 27 10.5" fill="none" stroke="#B3A685" stroke-width="1.1" opacity=".75"/>
  <path d="M33 16.2 Q31.4 13.8 33.4 11.8" fill="none" stroke="#B3A685" stroke-width="1.1" opacity=".75"/>

  <!-- burning sticks -->
  <g stroke="#6E5433" stroke-width="1.7" stroke-linecap="round">
    <path d="M31 39 L26 20"/>
    <path d="M32 39 L32 18.5"/>
    <path d="M33 39 L38 20"/>
  </g>
  <g fill="#C96F3B">
    <circle cx="26" cy="20" r="1.2"/>
    <circle cx="32" cy="18.5" r="1.2"/>
    <circle cx="38" cy="20" r="1.2"/>
  </g>
  <g fill="#E08A52">
    <circle cx="26" cy="19.6" r=".5"/>
    <circle cx="32" cy="18.1" r=".5"/>
    <circle cx="38" cy="19.6" r=".5"/>
  </g>

  <!-- dish -->
  <ellipse cx="32" cy="40" rx="12" ry="3.2" fill="#8F5F1E" stroke="#12100D" stroke-width="1.4"/>
  <path d="M20 40 Q21 47 32 47.5 Q43 47 44 40 Z" fill="#C08428" stroke="#12100D" stroke-width="1.7"/>
  <ellipse cx="32" cy="48.6" rx="6" ry="1.6" fill="#8F5F1E" stroke="#12100D" stroke-width="1.1"/>

  <!-- gold belly band -->
  <path d="M22.5 43 Q32 46.6 41.5 43" fill="none" stroke="#C8A24A" stroke-width="1.4"/>
</svg>
