<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cattle">
  <title>Cattle</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="52.5" rx="13" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- horns -->
  <path d="M21.5 22.5 Q16.5 22 15.5 16.5" fill="none" stroke="#B3A685" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M42.5 22.5 Q47.5 22 48.5 16.5" fill="none" stroke="#B3A685" stroke-width="2.8" stroke-linecap="round"/>

  <!-- head -->
  <path d="M21.5 24 Q21.5 19 27 18.5 H37 Q42.5 19 42.5 24 L43.5 36 Q43 43 37 44.5 H27 Q21 43 20.5 36 Z"
        fill="#8A6B45" stroke="#12100D" stroke-width="1.8"/>
  <!-- forehead patch -->
  <path d="M29 18.8 h6 v7 q-3 2 -6 0 Z" fill="#C98F3B" opacity=".95"/>

  <!-- eyes -->
  <circle cx="26" cy="28" r="1.1" fill="#12100D"/>
  <circle cx="38" cy="28" r="1.1" fill="#12100D"/>

  <!-- muzzle -->
  <rect x="24.5" y="36" width="15" height="9" rx="3.5" fill="#E8DCC0" stroke="#12100D" stroke-width="1.4"/>
  <circle cx="28.5" cy="41" r="1" fill="#12100D"/>
  <circle cx="35.5" cy="41" r="1" fill="#12100D"/>

  <!-- gold nose ring -->
  <circle cx="32" cy="43.5" r="2.6" fill="none" stroke="#C8A24A" stroke-width="1.6"/>
</svg>
