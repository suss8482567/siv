<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Berserker">
  <title>Berserker</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="31" cy="54.5" rx="12" ry="2" fill="#12100D" opacity=".45"/>

  <!-- fur mantle -->
  <g fill="#E8DCC0" stroke="#12100D" stroke-width="1.2">
    <circle cx="20" cy="44" r="4.6"/>
    <circle cx="27" cy="46.5" r="4.2"/>
    <circle cx="17" cy="49" r="3.6"/>
  </g>

  <!-- haft -->
  <path d="M21 52 L43 20" stroke="#6E5433" stroke-width="3.6" stroke-linecap="round"/>

  <!-- bearded axe head -->
  <path d="M36.5 12.5 L52 16.5 L48.5 27 L44.6 25.2 L40.5 31 L35.5 22.5 Z"
        fill="#B9B3A4" stroke="#12100D" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M39 15.5 L49.5 18" stroke="#8F887A" stroke-width="1.1" opacity=".9"/>

  <!-- gold wire wraps on the haft -->
  <path d="M27.5 41.5 L30.5 39 M25.5 44.5 L28.5 42" stroke="#C8A24A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
