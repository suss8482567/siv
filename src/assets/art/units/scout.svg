<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Scout">
  <title>Scout — falcon perched on a branch</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- tail fan -->
  <path d="M31 37 L45 48.5 L41.5 50.8 L37 52.3 L33.5 44 Z"
        fill="#5E7F46" stroke="#12100D" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M34.5 41 L42.5 48 M36.8 43.5 L40 50" stroke="#12100D" stroke-width=".8" opacity=".55"/>

  <!-- body + folded wing -->
  <path d="M25 14.5 Q33.5 15.5 36.5 23 Q39 30.5 35.5 39.5 Q31 44 26.5 40 Q21.5 32 22 23.5 Q22.5 17.5 25 14.5 Z"
        fill="#8FAE5F" stroke="#12100D" stroke-width="1.6"/>
  <path d="M27.5 20.5 Q34 24.5 33.8 34.5" fill="none" stroke="#5E7F46" stroke-width="1.5"/>
  <path d="M31.5 28 L34.5 27 M32.8 32 L35.8 31.4" stroke="#5E7F46" stroke-width="1.2"/>

  <!-- breast highlight -->
  <path d="M23.8 25.5 Q23.2 33.5 27 39.2" fill="none" stroke="#E8DCC0" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>

  <!-- eye + hooked beak -->
  <circle cx="26" cy="19.4" r="1.5" fill="#12100D"/>
  <circle cx="26.5" cy="18.9" r=".5" fill="#E8DCC0"/>
  <path d="M22.6 16.8 Q18 17.4 18.3 20.6 Q19.8 22.4 22.8 21.2 Z"
        fill="#C8A24A" stroke="#12100D" stroke-width="1"/>

  <!-- branch + talons with gold band -->
  <path d="M17 46.5 L47 42.5" stroke="#6E5433" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M28 41.5 L27.2 45.4 M32 43 L31.4 46.2" stroke="#12100D" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25.4 45.7 L29 45.2 M29.6 46.5 L33.2 46" stroke="#12100D" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="27.2" cy="44.6" r="1.4" fill="#C8A24A" stroke="#12100D" stroke-width=".8"/>
</svg>
