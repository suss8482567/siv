<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Knight">
  <title>Knight</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="53" rx="11" ry="2" fill="#12100D" opacity=".45"/>

  <!-- crossed blades behind the helm -->
  <path d="M17 19 L24 26 M47 19 L40 26" stroke="#B9B3A4" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M16.5 24 L21 26.5 M47.5 24 L43 26.5" stroke="#6E5433" stroke-width="2" stroke-linecap="round"/>

  <!-- great helm -->
  <path d="M24 16 L40 16 L40 39.5 Q40 44 36 44 L28 44 Q24 44 24 39.5 Z"
        fill="#B9B3A4" stroke="#12100D" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M24 20.5 L40 20.5" stroke="#8F887A" stroke-width="1.1" opacity=".9"/>

  <!-- eye slit + breath holes -->
  <rect x="26.5" y="25" width="11" height="2.6" fill="#12100D"/>
  <g fill="#12100D">
    <circle cx="32" cy="33" r=".8"/><circle cx="32" cy="35.5" r=".8"/><circle cx="32" cy="38" r=".8"/>
    <circle cx="29.5" cy="34.5" r=".8"/><circle cx="34.5" cy="34.5" r=".8"/>
  </g>

  <!-- gold circlet -->
  <path d="M24 22.5 L40 22.5" stroke="#C8A24A" stroke-width="1.8" stroke-linecap="round"/>
</svg>
