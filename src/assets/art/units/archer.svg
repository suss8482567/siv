<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Archer">
  <title>Archer</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="30" cy="56.5" rx="12" ry="2" fill="#12100D" opacity=".4"/>

  <!-- recurved bow limbs -->
  <path d="M23.5 9.5 C14 13 13 17.5 15.2 21.5 C10 28.5 10 35.5 15.2 42.5 C13 46.5 14 51 23.5 54.5"
        fill="none" stroke="#6E5433" stroke-width="3.2" stroke-linecap="round"/>
  <!-- string -->
  <path d="M23.5 9.5 L23.5 54.5" stroke="#B3A685" stroke-width="1"/>
  <!-- recurve tip curls -->
  <circle cx="23.5" cy="9.5" r="1.7" fill="#6E5433" stroke="#12100D" stroke-width=".8"/>
  <circle cx="23.5" cy="54.5" r="1.7" fill="#6E5433" stroke="#12100D" stroke-width=".8"/>
  <!-- gold grip wrap at the belly -->
  <path d="M11 28.6 L9.6 35.6" stroke="#C8A24A" stroke-width="4" stroke-linecap="round"/>

  <!-- arrow: shaft, slate fletching, bronze head -->
  <path d="M26 32 H44.5" stroke="#8A6B45" stroke-width="2" stroke-linecap="round"/>
  <path d="M27 31.2 L21 27.6 L23.9 31.2 Z M27 32.8 L21 36.4 L23.9 32.8 Z"
        fill="#7FA3A8" stroke="#12100D" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M26.6 32 H24.6" stroke="#12100D" stroke-width="1.6"/>
  <path d="M52 32 L45 28.4 V35.6 Z" fill="#C08428" stroke="#12100D" stroke-width="1" stroke-linejoin="round"/>
  <path d="M49.4 30.6 L47 32 L49.4 33.4" fill="none" stroke="#E5B969" stroke-width=".9" opacity=".85"/>
</svg>
