<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Catapult">
  <title>Catapult — torsion arm loosing a stone from the cup</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="31" cy="53.5" rx="14" ry="2" fill="#12100D" opacity=".45"/>

  <!-- base beam + A support -->
  <path d="M13 50 L48 50" stroke="#6E5433" stroke-width="4" stroke-linecap="round"/>
  <path d="M23 50 L30.5 33 M38 50 L30.5 33" fill="none" stroke="#6E5433" stroke-width="2.6"/>

  <!-- throwing arm -->
  <path d="M29 35 L46 19" stroke="#8A6B45" stroke-width="3.4" stroke-linecap="round"/>

  <!-- cup with stone -->
  <path d="M42.5 15 Q47.5 12.5 50.5 17.5 L45 21 Z"
        fill="#6E5433" stroke="#12100D" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="46.8" cy="16.2" r="3.6" fill="#B9B3A4" stroke="#12100D" stroke-width="1.3"/>

  <!-- torsion rope bundle -->
  <circle cx="30.5" cy="34" r="4" fill="#8A6B45" stroke="#12100D" stroke-width="1.4"/>
  <path d="M28 32 L33 36 M28 36 L33 32" stroke="#6E5433" stroke-width="1" opacity=".9"/>

  <!-- gold pivot pin -->
  <circle cx="30.5" cy="34" r="1.4" fill="#C8A24A" stroke="#12100D" stroke-width=".8"/>
</svg>
