<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Horseman">
  <title>Horseman — bay warhorse head with dark flowing mane</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="30" cy="54.5" rx="13" ry="2" fill="#12100D" opacity=".45"/>

  <!-- neck and head, muzzle to the left -->
  <path d="M15 27 Q12.5 24 16 21.5 L26 18.5 Q29 11 38 11.5 L45 15 L47.5 20 L41 20.5 Q39.5 28 33 33 Q25 39 21 51 L14 51 Q14.5 38 15 27 Z"
        fill="#96613A" stroke="#12100D" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- dark mane along the crest -->
  <path d="M37.5 11.5 Q46 15 45.5 23 L42.5 23 Q42 17 35 14.5 Z"
        fill="#3A2A1A" stroke="#12100D" stroke-width="1"/>
  <path d="M36 12 Q41 10 44 7.5" stroke="#3A2A1A" stroke-width="1.4" fill="none" opacity=".85"/>

  <!-- ear + face details -->
  <path d="M31 11.5 L33.5 7.5 L36 11 Z" fill="#96613A" stroke="#12100D" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="19.5" cy="25" r="1" fill="#12100D"/>
  <circle cx="14.5" cy="26.5" r=".9" fill="#12100D"/>

  <!-- gold bridle -->
  <path d="M20 28.5 L27 23.5 M16 29.5 Q21 32.5 26 29.5"
        fill="none" stroke="#C8A24A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
