<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lancer">
  <title>Lancer — couched lance with oxblood pennon over a mount's crest</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="30" cy="55" rx="13" ry="2" fill="#12100D" opacity=".45"/>

  <!-- mount's neck crest rising from the base -->
  <path d="M13 51 Q22 42 31 50 Q27 53.5 21 54 Q16.5 54.4 13 51 Z"
        fill="#96613A" stroke="#12100D" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- lance -->
  <path d="M17 49 L46 20" stroke="#8A6B45" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M50 14 L44 20 L47 23 Z"
        fill="#B9B3A4" stroke="#12100D" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M48 16.5 L45.5 19" stroke="#F1D79A" stroke-width=".9" opacity=".85"/>

  <!-- pennon -->
  <path d="M43.5 21.5 L36 25 L43 28.5 Z"
        fill="#A04030" stroke="#12100D" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- gold pennon tie -->
  <path d="M42.5 21 L44 23" stroke="#C8A24A" stroke-width="1.7" stroke-linecap="round"/>
</svg>
