<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Musketman">
  <title>Musketman — flintlock musket with steel barrel</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="30" cy="54.5" rx="13" ry="2" fill="#12100D" opacity=".45"/>

  <!-- wooden stock at the butt -->
  <path d="M12 52 L24 39.5" stroke="#8A6B45" stroke-width="5.4" stroke-linecap="round"/>

  <!-- steel barrel -->
  <path d="M22 41 L46 18.5" stroke="#B9B3A4" stroke-width="3" stroke-linecap="round"/>
  <!-- ramrod alongside -->
  <path d="M19 49 L42 27.5" stroke="#8F887A" stroke-width="1" opacity=".9"/>

  <!-- lock plate + hammer -->
  <circle cx="29.5" cy="34.5" r="2.5" fill="#6E5433" stroke="#12100D" stroke-width="1"/>
  <path d="M27.5 31.5 L32.5 28.5" stroke="#6E5433" stroke-width="2" stroke-linecap="round"/>

  <!-- gold barrel band -->
  <path d="M40.5 25 L44 21.5" stroke="#C8A24A" stroke-width="2" stroke-linecap="round"/>
</svg>
