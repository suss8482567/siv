<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crossbowman">
  <title>Crossbowman</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="54" rx="10" ry="2" fill="#12100D" opacity=".45"/>

  <!-- stock -->
  <rect x="30" y="26" width="4" height="24" rx="1"
        fill="#8A6B45" stroke="#12100D" stroke-width="1.6"/>

  <!-- steel prod -->
  <path d="M16 27 Q32 17 48 27" fill="none" stroke="#B9B3A4" stroke-width="3"/>
  <path d="M16 27 L32 36 L48 27" fill="none" stroke="#E8DCC0" stroke-width="1"/>

  <!-- bolt -->
  <path d="M32 30 L32 16" stroke="#6E5433" stroke-width="2"/>
  <path d="M29.6 16 L32 11 L34.4 16 Z"
        fill="#B9B3A4" stroke="#12100D" stroke-width="1" stroke-linejoin="round"/>

  <!-- stirrup -->
  <circle cx="32" cy="50.5" r="3.2" fill="none" stroke="#B9B3A4" stroke-width="1.6"/>

  <!-- gold trigger lever -->
  <path d="M28 40 L32.5 42.5 L28.5 45" fill="none" stroke="#C8A24A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
