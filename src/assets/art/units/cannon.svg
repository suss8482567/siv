<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cannon">
  <title>Cannon</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="31" cy="54" rx="14" ry="2" fill="#12100D" opacity=".45"/>

  <!-- carriage beam -->
  <path d="M20 44 L36 51" stroke="#6E5433" stroke-width="3.2" stroke-linecap="round"/>

  <!-- wheels (far one behind the barrel) -->
  <circle cx="38" cy="48" r="5.4" fill="#6E5433" stroke="#12100D" stroke-width="1.7"/>
  <circle cx="38" cy="48" r="1.6" fill="#12100D"/>
  <circle cx="26" cy="50" r="5.4" fill="#6E5433" stroke="#12100D" stroke-width="1.7"/>
  <g stroke="#4A3A22" stroke-width="1">
    <path d="M26 45 L26 55 M21.4 50 L30.6 50 M22.8 46.8 L29.2 53.2 M22.8 53.2 L29.2 46.8"/>
    <path d="M38 43.2 L38 52.8 M33.4 48 L42.6 48"/>
  </g>
  <circle cx="26" cy="50" r="1.6" fill="#12100D"/>

  <!-- tapered barrel, muzzle upper right -->
  <path d="M18 46 L42.5 24.5 L47 28.5 L23.5 50 Z"
        fill="#B9B3A4" stroke="#12100D" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="44.8" cy="26.6" rx="3.4" ry="2.9"
           transform="rotate(41 44.8 26.6)"
           fill="#8F887A" stroke="#12100D" stroke-width="1.2"/>
  <ellipse cx="44.8" cy="26.6" rx="1.7" ry="1.4"
           transform="rotate(41 44.8 26.6)" fill="#12100D"/>

  <!-- gold muzzle ring -->
  <path d="M40.5 21.5 L45 25.5" stroke="#C8A24A" stroke-width="2.2" stroke-linecap="round"/>
</svg>
