<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chu-Ko-Nu">
  <title>Chu-Ko-Nu</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="33" cy="52.5" rx="14" ry="2" fill="#12100D" opacity=".45"/>

  <!-- stock -->
  <rect x="12" y="35" width="34" height="5.4" rx="1"
        fill="#8A6B45" stroke="#12100D" stroke-width="1.6"/>

  <!-- lever under the butt -->
  <path d="M18 40.4 L27 40.4 L25 46 L16 46 Z"
        fill="#6E5433" stroke="#12100D" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- lacquer magazine -->
  <rect x="16" y="23.5" width="15" height="10.5" rx="1"
        fill="#A04030" stroke="#12100D" stroke-width="1.6"/>
  <!-- gold magazine band -->
  <path d="M16 29 L31 29" stroke="#C8A24A" stroke-width="2"/>

  <!-- twin bolts feeding forward -->
  <g stroke="#6E5433" stroke-width="2">
    <path d="M31 26.5 L42 26.5"/>
    <path d="M31 31 L42 31"/>
  </g>
  <path d="M41.5 24.8 L46.5 26.5 L41.5 28.2 Z M41.5 29.3 L46.5 31 L41.5 32.7 Z"
        fill="#B9B3A4" stroke="#12100D" stroke-width=".9" stroke-linejoin="round"/>

  <!-- front prod limb + string back to the magazine -->
  <path d="M45 38 Q54 34 50.5 25" fill="none" stroke="#B9B3A4" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M50.5 25 L30 34" stroke="#E8DCC0" stroke-width="1"/>
</svg>
