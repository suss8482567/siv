<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Spearman">
  <title>Spearman — crossed bronze-tipped spears bound at the center</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="56.5" rx="13" ry="2" fill="#12100D" opacity=".45"/>

  <defs>
    <!-- one spear, butt lower-left, leaf blade upper-right -->
    <g id="spear">
      <path d="M16.5 52 L44.5 19.5" stroke="#6E5433" stroke-width="3.2" stroke-linecap="round"/>
      <!-- socket + leaf blade -->
      <path d="M43.4 20.8 L40.8 23.7" stroke="#C08428" stroke-width="4" stroke-linecap="round"/>
      <path d="M48.5 12.5 L44.6 23 L42 20.7 L39.6 18 Z"
            fill="#C08428" stroke="#12100D" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M46.6 15.4 L43.9 21.2" stroke="#E5B969" stroke-width="1" opacity=".85"/>
      <!-- gold ferrule at the butt -->
      <path d="M17.6 50.7 L14.9 53.8" stroke="#C8A24A" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </defs>

  <use href="#spear"/>
  <use href="#spear" transform="matrix(-1 0 0 1 64 0)"/>

  <!-- gold-bound knot where the shafts cross -->
  <rect x="28.6" y="29.6" width="6.8" height="6.8" rx="1.4"
        transform="rotate(45 32 33)" fill="#1D1A14" stroke="#C8A24A" stroke-width="1.6"/>
</svg>
