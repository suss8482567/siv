<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Legion">
  <title>Legion — oxblood scutum flanked by laurel</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="53.5" rx="12" ry="2" fill="#12100D" opacity=".45"/>

  <!-- gladius hilts peeking over the shoulders -->
  <path d="M20 22 L24 26 M44 22 L40 26" stroke="#B9B3A4" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M19 25 L23 27 M45 25 L41 27" stroke="#6E5433" stroke-width="2" stroke-linecap="round"/>

  <!-- laurel sprigs -->
  <g fill="#8FAE5F" stroke="#12100D" stroke-width="1">
    <path d="M15 30 Q13 36 16 42 L18 41 Q15.6 36 17.4 31 Z"/>
    <path d="M49 30 Q51 36 48 42 L46 41 Q48.4 36 46.6 31 Z"/>
  </g>

  <!-- scutum -->
  <rect x="22" y="16" width="20" height="34" rx="9"
        fill="#A04030" stroke="#12100D" stroke-width="2"/>
  <rect x="24.8" y="19" width="14.4" height="28" rx="7"
        fill="none" stroke="#6E2A20" stroke-width="1.2" stroke-dasharray="2 2.5"/>

  <!-- gold umbo boss -->
  <circle cx="32" cy="33" r="3.4" fill="#C8A24A" stroke="#12100D" stroke-width="1.2"/>
</svg>
