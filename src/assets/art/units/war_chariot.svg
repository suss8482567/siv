<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="War Chariot">
  <title>War Chariot</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="31" cy="53.5" rx="14" ry="2" fill="#12100D" opacity=".45"/>

  <!-- cab -->
  <path d="M16 24 L38 24 L40 37 L18 35 Z"
        fill="#C9B98A" stroke="#12100D" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M18.6 29 L38.6 29" stroke="#8F8058" stroke-width="1.1" opacity=".9"/>
  <path d="M21 24 L21 34 M27 24 L27 34.6 M33 24 L33 35.6"
        stroke="#8F8058" stroke-width="1" opacity=".8"/>

  <!-- yoke pole curving out front -->
  <path d="M39 27 Q50 27 53 36" fill="none" stroke="#6E5433" stroke-width="3" stroke-linecap="round"/>
  <!-- gold yoke binding -->
  <circle cx="39.6" cy="27" r="2.2" fill="#C8A24A" stroke="#12100D" stroke-width="1"/>

  <!-- axle + wheel -->
  <path d="M28 36 L28 44" stroke="#4A3A22" stroke-width="2.4"/>
  <circle cx="28" cy="44.5" r="8.6" fill="#6E5433" stroke="#12100D" stroke-width="2"/>
  <g stroke="#4A3A22" stroke-width="1.2">
    <path d="M28 36.5 L28 52.5"/>
    <path d="M20.5 40.5 L35.5 48.5"/>
    <path d="M20.5 48.5 L35.5 40.5"/>
  </g>
  <circle cx="28" cy="44.5" r="2" fill="#12100D"/>
</svg>
