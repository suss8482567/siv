<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Keshik">
  <title>Keshik</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="54.5" rx="11" ry="2" fill="#12100D" opacity=".45"/>

  <!-- composite recurve limbs -->
  <path d="M26 12 Q16 20 21 32 Q16 44 26 52"
        fill="none" stroke="#8A6B45" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M26 12 Q19 19 23 27 M26 52 Q19 45 23 37"
        fill="none" stroke="#6E5433" stroke-width="1.2" opacity=".85"/>

  <!-- string, drawn to the nock -->
  <path d="M26 12 L33 32 L26 52" fill="none" stroke="#E8DCC0" stroke-width="1"/>

  <!-- arrow at full draw -->
  <path d="M31 32 L48 32" stroke="#6E5433" stroke-width="2"/>
  <path d="M47.6 29.4 L53.5 32 L47.6 34.6 Z"
        fill="#C08428" stroke="#12100D" stroke-width="1.1" stroke-linejoin="round"/>
  <g fill="#7FA3A8">
    <path d="M31 29.6 L35.4 32 L31 34.4 L31 32 Z"/>
  </g>

  <!-- gold grip wrap at the draw hand -->
  <path d="M22.5 29 L26.5 29 M22.5 35 L26.5 35" stroke="#C8A24A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
