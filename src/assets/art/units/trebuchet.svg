<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trebuchet">
  <title>Trebuchet</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="30" cy="54" rx="14" ry="2" fill="#12100D" opacity=".45"/>

  <!-- A-frame -->
  <path d="M20 52 L30 23 M40 52 L30 23" fill="none" stroke="#6E5433" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M24 41 L36 41" stroke="#6E5433" stroke-width="2"/>

  <!-- long arm, counterweight end high -->
  <path d="M17 13.5 L46 34" stroke="#8A6B45" stroke-width="3" stroke-linecap="round"/>

  <!-- counterweight box -->
  <path d="M16.5 13.5 L16.5 12 M16.5 12 L17.5 12" stroke="#4A3A22" stroke-width="1.4"/>
  <rect x="11" y="14.5" width="10.5" height="9.5"
        fill="#B9B3A4" stroke="#12100D" stroke-width="1.6"/>
  <path d="M11 19.2 L21.5 19.2" stroke="#8F887A" stroke-width="1" opacity=".9"/>

  <!-- sling rope and pouch -->
  <path d="M46 34 Q53 39 49.5 46" fill="none" stroke="#8A6B45" stroke-width="1.7"/>
  <ellipse cx="49" cy="47.5" rx="3.2" ry="2.1"
           fill="#8A6B45" stroke="#12100D" stroke-width="1.2"/>

  <!-- gold axle pin -->
  <circle cx="30" cy="24" r="1.7" fill="#C8A24A" stroke="#12100D" stroke-width=".9"/>
</svg>
