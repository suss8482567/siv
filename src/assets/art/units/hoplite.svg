<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hoplite">
  <title>Hoplite — bronze aspis over a couched doru spear</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="31" cy="53.5" rx="12" ry="2" fill="#12100D" opacity=".45"/>

  <!-- doru spear behind the shield -->
  <path d="M15 51 L44 18" stroke="#6E5433" stroke-width="3" stroke-linecap="round"/>
  <path d="M48.5 12 L44.2 22.4 L41.6 19.8 L39.8 16.6 Z"
        fill="#C08428" stroke="#12100D" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M46.4 15 L43.6 21" stroke="#E5B969" stroke-width="1" opacity=".85"/>

  <!-- aspis shield face -->
  <circle cx="30" cy="34" r="14.2" fill="#C08428" stroke="#12100D" stroke-width="2"/>
  <circle cx="30" cy="34" r="10.6" fill="none" stroke="#8F6218" stroke-width="1.2"/>
  <g stroke="#8F6218" stroke-width="1.1" fill="none" opacity=".9">
    <path d="M30 23.4 L30 27"/>
    <path d="M39.2 28.7 L36.2 30.5"/>
    <path d="M39.2 39.3 L36.2 37.5"/>
    <path d="M30 44.6 L30 41"/>
    <path d="M20.8 39.3 L23.8 37.5"/>
    <path d="M20.8 28.7 L23.8 30.5"/>
  </g>
  <circle cx="30" cy="34" r="4.6" fill="#8F6218" stroke="#12100D" stroke-width="1.1"/>

  <!-- gold boss stud -->
  <circle cx="30" cy="34" r="1.8" fill="#C8A24A" stroke="#12100D" stroke-width=".8"/>
</svg>
