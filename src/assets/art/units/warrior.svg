<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Warrior">
  <title>Warrior</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- ground shadow -->
  <ellipse cx="31" cy="54.5" rx="14" ry="2.2" fill="#12100D" opacity=".45"/>

  <!-- hide shield -->
  <circle cx="26.5" cy="36.5" r="12.8" fill="#8A6B45" stroke="#12100D" stroke-width="2"/>
  <circle cx="26.5" cy="36.5" r="10.4" fill="none" stroke="#4A3A22" stroke-width="1.1" stroke-dasharray="2 2.5"/>
  <!-- war-paint stripe + rivets + gold boss -->
  <path d="M15.6 33.5 Q26.5 26.2 37.4 33.5" fill="none" stroke="#A04030" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="26.5" cy="27" r=".95" fill="#12100D"/>
  <circle cx="35.6" cy="33.4" r=".95" fill="#12100D"/>
  <circle cx="32.2" cy="44.4" r=".95" fill="#12100D"/>
  <circle cx="17.4" cy="41" r=".95" fill="#12100D"/>
  <circle cx="26.5" cy="37.5" r="3.3" fill="#C8A24A" stroke="#12100D" stroke-width="1.1"/>

  <!-- club shaft (flint-spiked ball head) -->
  <path d="M36.5 51.5 L46 28.5" stroke="#6E5433" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="47.3" cy="25" r="6.1" fill="#6E5433" stroke="#12100D" stroke-width="1.5"/>
  <!-- knapped flint flakes around the head -->
  <g fill="#B9B3A4" stroke="#12100D" stroke-width=".8">
    <path d="M47.3 16.2 L49 19 L45.6 19 Z"/>
    <path d="M54 21.5 L52.6 24.4 L50.4 22.2 Z"/>
    <path d="M53.6 30 L50.6 29 L52.6 26.8 Z"/>
    <path d="M42 17.6 L44.6 19.4 L41.8 20.8 Z"/>
    <path d="M40.6 24.5 L43.6 23.4 L43 26.4 Z"/>
  </g>
  <!-- gold grip wraps -->
  <path d="M39.4 44.2 L42.6 43 M40.9 40.6 L44.1 39.4" stroke="#C8A24A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
