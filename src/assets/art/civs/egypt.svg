<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Egypt">
  <title>Egypt</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- loop -->
  <ellipse cx="32" cy="21" rx="6.8" ry="9.2" fill="#C9B98A" stroke="#12100D" stroke-width="1.8"/>
  <ellipse cx="32" cy="21.5" rx="3.1" ry="5.6" fill="#1D1A14" stroke="#12100D" stroke-width="1"/>

  <!-- crossbar + stem -->
  <rect x="20" y="31" width="24" height="5" rx="1.2" fill="#C9B98A" stroke="#12100D" stroke-width="1.6"/>
  <rect x="29.2" y="36" width="5.6" height="13" rx="1.2" fill="#C9B98A" stroke="#12100D" stroke-width="1.6"/>

  <!-- stone sheen -->
  <path d="M30.4 37 V47" stroke="#EFE3C4" stroke-width="1" opacity=".9"/>
  <path d="M21.4 32.4 H27" stroke="#EFE3C4" stroke-width="1" opacity=".9"/>

  <!-- gold wrap at the junction -->
  <rect x="28.4" y="29.4" width="7.2" height="3.2" rx="1"
        fill="#C8A24A" stroke="#12100D" stroke-width=".9"/>
</svg>
