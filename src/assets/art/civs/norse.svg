<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Norse">
  <title>Norse</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- beveled top face -->
  <path d="M20 20 L22.5 17 H41.5 L44 20 Z" fill="#AEB6C4" stroke="#12100D" stroke-width="1.4"/>

  <!-- hammer head -->
  <polygon points="20,20 44,20 46.5,26 44,32 20,32 17.5,26"
           fill="#7E8698" stroke="#12100D" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M17.5 26 H46.5" stroke="#4C5262" stroke-width="1"/>

  <!-- engraved mark -->
  <path d="M28 23 L32 28.6 L36 23" fill="none" stroke="#4C5262" stroke-width="1.2"/>

  <!-- handle -->
  <rect x="30.2" y="32" width="3.6" height="14" fill="#6E5433" stroke="#12100D" stroke-width="1.5"/>
  <circle cx="32" cy="47.8" r="2.4" fill="#6E5433" stroke="#12100D" stroke-width="1.4"/>

  <!-- gold wire wraps -->
  <rect x="29.7" y="34.6" width="4.6" height="1.7" rx=".7" fill="#C8A24A" stroke="#12100D" stroke-width=".7"/>
  <rect x="29.7" y="38.4" width="4.6" height="1.7" rx=".7" fill="#C8A24A" stroke="#12100D" stroke-width=".7"/>
</svg>
