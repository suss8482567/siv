<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Barbarians">
  <title>Barbarians — crossed raiding axes</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- hafts, crossing low -->
  <path d="M22 46 L40.5 19" stroke="#6E5433" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M42 46 L23.5 19" stroke="#6E5433" stroke-width="2.6" stroke-linecap="round"/>

  <!-- knapped axe heads -->
  <polygon points="37.5,15.5 45,14.5 46,21 40,22.3" fill="#7E8698" stroke="#12100D" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M39.5 16.8 L44 17.6 M38.8 19 L42.5 19.9" stroke="#B3A685" stroke-width=".8"/>
  <polygon points="26.5,15.5 19,14.5 18,21 24,22.3" fill="#7E8698" stroke="#12100D" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M24.5 16.8 L20 17.6 M25.2 19 L21.5 19.9" stroke="#B3A685" stroke-width=".8"/>

  <!-- oxblood lashings below the heads -->
  <g stroke="#A04030" stroke-width="1.6">
    <path d="M38.4 22.6 L41 24.4 M37.2 24.4 L39.8 26.2"/>
    <path d="M25.6 22.6 L23 24.4 M26.8 24.4 L24.2 26.2"/>
  </g>

  <!-- looted gold torc threaded on a haft -->
  <circle cx="36" cy="27.5" r="2.3" fill="none" stroke="#C8A24A" stroke-width="1.5"/>

  <!-- butt caps -->
  <circle cx="22" cy="46" r="1" fill="#12100D"/>
  <circle cx="42" cy="46" r="1" fill="#12100D"/>
</svg>
