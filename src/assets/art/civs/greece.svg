<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Greece">
  <title>Greece — Corinthian helmet</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- crest plume -->
  <path d="M36.5 13.5 Q46 12 48.5 20 Q49.5 24 47 26 Q46 19 39 17.5 Z"
        fill="#A04030" stroke="#12100D" stroke-width="1.5"/>
  <path d="M42.5 16.2 L44.5 20 M45.8 19 L46.8 22.5" stroke="#7D2F24" stroke-width=".9"/>

  <!-- helmet dome + cheek guard -->
  <path d="M39 15 Q26 15.5 23 26 Q21.8 31.5 24 36.5 L26 45 Q26.3 47 28.3 47 H31.8 L30.8 40.5 Q30.4 37 33 35.8 L37.5 34.8 Q42 33.5 42.3 28.5 Q42.7 21 39 15 Z"
        fill="#C08428" stroke="#12100D" stroke-width="1.8"/>

  <!-- T-shaped face opening -->
  <rect x="24.3" y="27.6" width="8" height="3.1" rx="1.5" fill="#1D1A14"/>
  <rect x="29.4" y="21.5" width="1.9" height="9.5" rx=".9" fill="#1D1A14"/>
  <!-- eye glint -->
  <circle cx="26.2" cy="29.1" r=".7" fill="#B3A685"/>

  <!-- gold brow band -->
  <path d="M23.8 25.3 Q28 22.6 33.5 23" fill="none" stroke="#C8A24A" stroke-width="1.5"/>
</svg>
