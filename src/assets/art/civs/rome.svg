<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rome">
  <title>Rome — laurel wreath</title>
  <!-- Gilded Hex Seal frame (canonical, see docs/ART_STYLE.md) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#1D1A14" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="32,5.5 55,18.75 55,45.25 32,58.5 9,45.25 9,18.75" fill="none" stroke="#3A3325" stroke-width="1"/>
  <circle cx="32" cy="32" r="22.7" fill="none" stroke="#B3A685" stroke-width="1" stroke-dasharray="1 3" opacity=".5"/>

  <!-- left branch -->
  <path d="M24 46 Q17 38 18.5 26 Q19.3 21 23 17.5" fill="none" stroke="#5E7F46" stroke-width="1.6"/>
  <g fill="#8FAE5F" stroke="#5E7F46" stroke-width=".9">
    <ellipse cx="20.5" cy="42" rx="2.2" ry="4.8" transform="rotate(52 20.5 42)"/>
    <ellipse cx="18.6" cy="36.5" rx="2.2" ry="4.8" transform="rotate(70 18.6 36.5)"/>
    <ellipse cx="18.2" cy="30.5" rx="2.2" ry="4.8" transform="rotate(86 18.2 30.5)"/>
    <ellipse cx="19.4" cy="24.8" rx="2.2" ry="4.8" transform="rotate(104 19.4 24.8)"/>
    <ellipse cx="22" cy="20" rx="2.2" ry="4.8" transform="rotate(122 22 20)"/>
  </g>

  <!-- right branch -->
  <path d="M40 46 Q47 38 45.5 26 Q44.7 21 41 17.5" fill="none" stroke="#5E7F46" stroke-width="1.6"/>
  <g fill="#8FAE5F" stroke="#5E7F46" stroke-width=".9">
    <ellipse cx="43.5" cy="42" rx="2.2" ry="4.8" transform="rotate(-52 43.5 42)"/>
    <ellipse cx="45.4" cy="36.5" rx="2.2" ry="4.8" transform="rotate(-70 45.4 36.5)"/>
    <ellipse cx="45.8" cy="30.5" rx="2.2" ry="4.8" transform="rotate(-86 45.8 30.5)"/>
    <ellipse cx="44.6" cy="24.8" rx="2.2" ry="4.8" transform="rotate(-104 44.6 24.8)"/>
    <ellipse cx="42" cy="20" rx="2.2" ry="4.8" transform="rotate(-122 42 20)"/>
  </g>

  <!-- gold binding cord -->
  <path d="M26.5 47.5 Q32 50.5 37.5 47.5" fill="none" stroke="#C8A24A" stroke-width="1.8"/>
  <circle cx="32" cy="48.4" r="1.6" fill="#C8A24A" stroke="#12100D" stroke-width=".8"/>
</svg>
